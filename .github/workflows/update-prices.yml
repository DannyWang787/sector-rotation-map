name: Update prices

on:
  schedule:
    # 22:30 UTC on weekdays, after the US close (5:30pm EST / 6:30pm EDT)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices and rebuild page
        run: python scripts/update_prices.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update prices $(date -u +%F)"
          git push
