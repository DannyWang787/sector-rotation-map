  <header class="top">

    <div class="ctl"><span>Zoom</span><button class="btn" id="zOut" aria-label="Zoom out">−</button><span class="mono" id="zVal">100%</span><button class="btn" id="zIn" aria-label="Zoom in">+</button><button class="btn" id="zReset">Reset</button></div>
    <label class="chk"><input type="checkbox" id="labels" checked> Labels</label>
    <label class="chk"><input type="checkbox" id="onlySel"> Only selected</label>
  </div>

  <div class="main">
    <div class="card chart-card" id="chartCard">
      <div class="chart-head">
        <span class="asof" id="asof">—</span>
        <span class="note">Tap a dot to inspect · Ctrl + scroll to zoom</span>
      </div>
      <svg id="rrg" viewBox="0 0 800 640" role="img" aria-label="Relative rotation chart"></svg>
      <div class="scrub">
        <button class="btn" id="play" aria-label="Replay history">▶ Replay</button>
        <input type="range" id="endIdx" aria-label="Chart date">
        <button class="btn" id="latest">Latest</button>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>

    <aside class="side">
      <section class="card">
        <div class="list-head">
          <p class="eyebrow" style="margin:0">Sectors</p>
          <div style="display:flex;gap:6px"><button class="btn" id="selAll">All</button><button class="btn" id="selNone">None</button></div>
        </div>
        <div class="cols"><span></span><span></span><span>Sector</span><span>Quadrant</span><span title="Heading">Dir</span><span style="text-align:right" id="hRet">1M</span><span style="text-align:right">vs SPY</span></div>
        <div class="rows" id="rows"></div>
      </section>
    </aside>
  </div>

</div>

/* ---------- sample data (deterministic, clearly synthetic) ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function makeSample(){
  const r=mulberry(20261009),dates=[];let t=Date.UTC(2026,9,9);
  while(dates.length<560){const d=new Date(t).getUTCDay();if(d!==0&&d!==6)dates.unshift(t);t-=DAY}
  const n=dates.length,spy=[560];
  for(let i=1;i<n;i++)spy.push(spy[i-1]*Math.exp(0.0004+0.0095*gauss(r)));
  const tick=Object.keys(NAMES),series={SPY:spy};
  const base={XLK:230,XLF:48,XLI:135,XLE:88,XLV:142,XLY:205,XLP:79,XLC:98,XLB:90,XLU:76,XLRE:41};
  const beta={XLK:1.25,XLF:1.05,XLI:1.0,XLE:0.7,XLV:0.75,XLY:1.15,XLP:0.55,XLC:1.1,XLB:0.95,XLU:0.5,XLRE:0.85};
  tick.forEach((k,j)=>{
    const P=150+r()*170,ph=r()*Math.PI*2,amp=0.0011+r()*0.0009,P2=55+r()*40,ph2=r()*6.28;
    let rel=0;const out=[base[k]];
    for(let i=1;i<n;i++){
      const m=Math.log(spy[i]/spy[i-1]);
      rel=amp*Math.sin(2*Math.PI*i/P+ph)+0.0004*Math.sin(2*Math.PI*i/P2+ph2);
      out.push(out[i-1]*Math.exp(beta[k]*m+rel+0.0055*gauss(r)));
    }

}

/* ---------- CSV import ---------- */
function parseCSV(text){
  const lines=text.replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length<3)throw new Error("Need a header row and at least a few rows of prices.");
  const sep=lines[0].includes(";")&&!lines[0].includes(",")?";":lines[0].includes("\t")?"\t":",";
  const head=lines[0].split(sep).map(h=>h.replace(/"/g,"").trim());
  const di=head.findIndex(h=>/^(date|time|datetime|day)$/i.test(h));
  const dIdx=di<0?0:di;
  const cols=head.map((h,i)=>({h:h.toUpperCase(),i})).filter(c=>c.i!==dIdx&&c.h);
  if(cols.length<2)throw new Error("Need a benchmark column plus at least one ticker column.");
  const rows=[];
  for(let li=1;li<lines.length;li++){
    const p=lines[li].split(sep).map(s=>s.replace(/"/g,"").trim());
    const t=Date.parse(p[dIdx]);if(isNaN(t))continue;
    const vals=cols.map(c=>parseFloat(p[c.i]));
    rows.push({t:Date.UTC(new Date(t).getUTCFullYear(),new Date(t).getUTCMonth(),new Date(t).getUTCDate()),vals});
  }
  if(rows.length<25)throw new Error("Only "+rows.length+" dated rows were readable. Check the Date column format (YYYY-MM-DD works best).");
  rows.sort((a,b)=>a.t-b.t);
  // forward-fill gaps
  const series={};cols.forEach((c,j)=>{let last=null;series[c.h]=rows.map(r=>{const v=r.vals[j];if(isFinite(v)&&v>0)last=v;return last})});
  // drop leading rows where any column is missing
  let start=0;while(start<rows.length&&cols.some(c=>series[c.h][start]==null))start++;
  const dates=rows.slice(start).map(r=>r.t);cols.forEach(c=>series[c.h]=series[c.h].slice(start));
  if(dates.length<25)throw new Error("Too few rows where every column has a price.");
  const bench=series.SPY?"SPY":cols[0].h;
  const gaps=[];for(let i=1;i<Math.min(dates.length,60);i++)gaps.push(dates[i]-dates[i-1]);gaps.sort((a,b)=>a-b);
  const freq=gaps[gaps.length>>1]<=3*DAY?"D":"W";
  return {source:"import",name:"Your CSV",freq,bench,dates,series};
}
function toWeekly(ds){
  if(ds.freq==="W")return ds;
  const keys=[],idx=[];
  ds.dates.forEach((t,i)=>{const d=new Date(t).getUTCDay();const k=t-((d+6)%7)*DAY;if(keys.length&&keys[keys.length-1]===k)idx[idx.length-1]=i;else{keys.push(k);idx.push(i)}});
  const series={};Object.keys(ds.series).forEach(k=>series[k]=idx.map(i=>ds.series[k][i]));
  return {...ds,freq:"W",dates:idx.map(i=>ds.dates[i]),series};
}

/* ---------- RRG-style math ---------- */
function ema(arr,S){if(S<=1)return arr.slice();const k=2/(S+1);let p=null;return arr.map(v=>{if(v==null)return null;p=p==null?v:p+k*(v-p);return p})}
function compute(ds,N,M,S){
  const b=ds.series[ds.bench],out={};
  Object.keys(ds.series).forEach(tk=>{
    if(tk===ds.bench)return;
    const c=ds.series[tk],rs=c.map((v,i)=>v/b[i]),n=rs.length,rsr=new Array(n).fill(null),mom=new Array(n).fill(null);
    let sum=0;
    for(let i=0;i<n;i++){sum+=rs[i];if(i>=N)sum-=rs[i-N];if(i>=N-1)rsr[i]=100*rs[i]/(sum/N)}
    for(let i=0;i<n;i++)if(rsr[i]!=null&&i-M>=0&&rsr[i-M]!=null)mom[i]=100*rsr[i]/rsr[i-M];
    const x=ema(rsr.map((v,i)=>mom[i]==null?null:v),S),y=ema(mom,S);
    out[tk]={x,y,close:c};
  });
  return out;
}
function quad(x,y){return x>=100?(y>=100?"leading":"weakening"):(y>=100?"improving":"lagging")}
const ARROWS=["→","↗","↑","↖","←","↙","↓","↘"];
function headingOf(dx,dy){const a=Math.atan2(dy,dx)*180/Math.PI;return{deg:a,glyph:ARROWS[((Math.round(a/45)%8)+8)%8]}}
function describeHeading(deg){
  if(deg>=10&&deg<=80)return"moving up and to the right, the strongest direction";
  if(deg>80&&deg<=100)return"gaining momentum without much change in relative strength yet";
  if(deg>100&&deg<=170)return"gaining momentum while relative strength still slips";
  if(deg>170||deg<-170)return"losing relative strength";
  if(deg>=-170&&deg<-100)return"moving down and to the left, the weakest direction";
  if(deg>=-100&&deg<-80)return"losing momentum";
  if(deg>=-80&&deg<-10)return"still gaining relative strength but with fading momentum";
  return"gaining relative strength";
}

/* ---------- chart ---------- */
const svg=$("rrg");let W=800,H=640;const ML=54,MR=18,MT=18,MB=46;
function fitViewBox(){const cw=svg.getBoundingClientRect().width||800;if(cw<600){W=Math.max(380,Math.round(cw*1.25));H=Math.round(W*0.95)}else{W=800;H=640}svg.setAttribute("viewBox",`0 0 ${W} ${H}`)}
let resizeT=null;window.addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(st.res)render()},150)});
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function niceStep(range){const raw=range/6,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<1.5?1:m<3?2:m<7?5:10)*p}
function visibleTickers(){return Object.keys(st.res).filter(k=>!st.onlySel||st.selected.has(k))}
function trail(k,p){const r=st.res[k],pts=[];const from=Math.max(st.first,st.end-p.tailBars+1);
  for(let i=from;i<=st.end;i++)if(r.x[i]!=null&&r.y[i]!=null)pts.push({x:r.x[i],y:r.y[i],i});return pts}
function render(){
  fitViewBox();
  const p=params(),vis=visibleTickers(),trails={};
  let mx=0.4,my=0.4;
  vis.forEach(k=>{trails[k]=trail(k,p);trails[k].forEach(q=>{mx=Math.max(mx,Math.abs(q.x-100));my=Math.max(my,Math.abs(q.y-100))})});
  mx=mx*1.15/st.zoom;my=my*1.15/st.zoom;
  const sx=v=>ML+(v-(100-mx))/(2*mx)*(W-ML-MR),sy=v=>MT+(1-(v-(100-my))/(2*my))*(H-MT-MB);
  svg.textContent="";
  const cx=sx(100),cy=sy(100),x0=ML,x1=W-MR,y0=MT,y1=H-MB;
  const quads=[["improving",x0,y0,cx,cy,"var(--q-imp-bg)"],["leading",cx,y0,x1,cy,"var(--q-lead-bg)"],["lagging",x0,cy,cx,y1,"var(--q-lag-bg)"],["weakening",cx,cy,x1,y1,"var(--q-weak-bg)"]];
  quads.forEach(([q,a,b,c,d,f])=>el("rect",{x:a,y:b,width:c-a,height:d-b,fill:f},svg));
  const clip=el("clipPath",{id:"plot"},el("defs",{},svg));el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0},clip);
  // grid
  const g=el("g",{},svg);
  const stx=niceStep(2*mx),sty=niceStep(2*my);
  for(let v=Math.ceil((100-mx)/stx)*stx;v<=100+mx+1e-9;v+=stx){const X=sx(v);el("line",{x1:X,x2:X,y1:y0,y2:y1,stroke:"var(--grid)"},g);
    const t=el("text",{x:X,y:y1+16,"text-anchor":"middle","font-size":11,fill:"var(--muted)","font-family":"JetBrains Mono, monospace"},g);t.textContent=+v.toFixed(2)}
  for(let v=Math.ceil((100-my)/sty)*sty;v<=100+my+1e-9;v+=sty){const Y=sy(v);el("line",{x1:x0,x2:x1,y1:Y,y2:Y,stroke:"var(--grid)"},g);
    const t=el("text",{x:x0-6,y:Y+4,"text-anchor":"end","font-size":11,fill:"var(--muted)","font-family":"JetBrains Mono, monospace"},g);t.textContent=+v.toFixed(2)}
  el("line",{x1:cx,x2:cx,y1:y0,y2:y1,stroke:"var(--axis)","stroke-width":1.2},g);
  el("line",{x1:x0,x2:x1,y1:cy,y2:cy,stroke:"var(--axis)","stroke-width":1.2},g);
  const ql=[["Improving",x0+10,y0+20,"start","var(--q-imp)"],["Leading",x1-10,y0+20,"end","var(--q-lead)"],["Lagging",x0+10,y1-10,"start","var(--q-lag)"],["Weakening",x1-10,y1-10,"end","var(--q-weak)"]];
  ql.forEach(([t,x,y,a,c])=>{const e=el("text",{x,y,"text-anchor":a,"font-size":15,"font-weight":800,fill:c,"font-family":"Archivo, sans-serif","font-stretch":"80%","letter-spacing":".06em",opacity:.85},svg);e.textContent=t.toUpperCase()});
  const bn=st.raw.bench,narrow=W<600;
  let e=el("text",{x:(x0+x1)/2,y:H-8,"text-anchor":"middle","font-size":11.5,fill:"var(--muted)"},svg);e.textContent=narrow?`RS-Ratio · ← weaker | stronger than ${bn} →`:`RS-Ratio  ·  ← underperforming ${bn}   |   outperforming ${bn} →`;
  e=el("text",{x:14,y:(y0+y1)/2,"text-anchor":"middle","font-size":11.5,fill:"var(--muted)",transform:`rotate(-90 14 ${(y0+y1)/2})`},svg);e.textContent=narrow?"RS-Momentum · ↓ fading | rising ↑":"RS-Momentum  ·  ↓ fading   |   rising ↑";
  // trails
  const plot=el("g",{"clip-path":"url(#plot)"},svg),heads=el("g",{},svg);
  const order=vis.slice().sort((a,b)=>(a===st.focus)-(b===st.focus));
  order.forEach(k=>{
    const pts=trails[k];if(!pts.length)return;
    const col=colorOf[k],dim=st.focus&&k!==st.focus&&vis.length>1?0.85:1,isF=k===st.focus;
    for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],f=0.5+0.5*i/(pts.length-1||1);
      el("line",{x1:sx(a.x),y1:sy(a.y),x2:sx(b.x),y2:sy(b.y),stroke:col,"stroke-width":isF?4.2:3,"stroke-linecap":"round",opacity:(f*dim).toFixed(2)},plot)}
    pts.slice(0,-1).forEach((q,i)=>el("circle",{cx:sx(q.x),cy:sy(q.y),r:isF?3.6:2.8,fill:col,opacity:((0.6+0.4*i/pts.length)*dim).toFixed(2)},plot));
    const h=pts[pts.length-1],X=sx(h.x),Y=sy(h.y);
    const inside=X>=x0&&X<=x1&&Y>=y0&&Y<=y1;if(!inside)return;
    const hc=el("circle",{cx:X,cy:Y,r:isF?10:8,fill:col,stroke:"var(--panel)","stroke-width":2.5,style:"cursor:pointer",tabindex:0,"data-k":k},heads);
    hc.addEventListener("click",()=>{setFocus(k)});
    hc.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();setFocus(k)}});
    hc.addEventListener("mouseenter",ev=>showTip(k,ev));hc.addEventListener("mouseleave",hideTip);
    if(st.labels){const right=X<x1-60;const t=el("text",{x:X+(right?11:-11),y:Y+4,"text-anchor":right?"start":"end","font-size":isF?13:11.5,"font-weight":isF?700:500,fill:"var(--ink)","font-family":"JetBrains Mono, monospace",style:"pointer-events:none;paint-order:stroke",stroke:"var(--panel)","stroke-width":3,"stroke-linejoin":"round"},heads);t.textContent=k}
  });
  if(!vis.length){const t=el("text",{x:(x0+x1)/2,y:(y0+y1)/2,"text-anchor":"middle",fill:"var(--muted)","font-size":14},svg);t.textContent="No sectors selected. Pick some in the list, or untick Only selected."}
  $("zVal").textContent=Math.round(st.zoom*100)+"%";
  $("tailVal").textContent=st.tail+"W";
  const d=new Date(st.active.dates[st.end]);
  $("asof").textContent=(st.tf==="W"?"Week ending ":"Close ")+d.toISOString().slice(0,10)+" · vs "+st.raw.bench+(st.end<st.active.dates.length-1?" · historical view":"");
  renderSide(p);
}

/* ---------- side panels ---------- */
function snapshot(p){
  const out={},b=st.active.series[st.active.bench],e=st.end,s=Math.max(0,e-p.retBars);
  const bret=b[e]/b[s]-1;
  Object.keys(st.res).forEach(k=>{const r=st.res[k],x=r.x[e],y=r.y[e];
    let pi=e-1;while(pi>=st.first&&(r.x[pi]==null))pi--;
    const hd=pi>=st.first?headingOf(x-r.x[pi],y-r.y[pi]):{deg:0,glyph:"·"};
    const ret=r.close[e]/r.close[s]-1;
    out[k]={x,y,q:quad(x,y),hd,ret,rel:ret-bret,dist:Math.hypot(x-100,y-100),score:(x-100)+(y-100)}});
  return {snap:out,bret};
}
const pct=v=>(v>=0?"+":"")+(v*100).toFixed(1)+"%";
const nm=k=>NAMES[k]||k;
function renderSide(p){
  const {snap,bret}=snapshot(p),ks=Object.keys(snap);
  const f=snap[st.focus]?st.focus:ks[0];st.focus=f;
  // rows
  $("hRet").textContent=st.period;
  const qOrder={leading:0,improving:1,weakening:2,lagging:3};
  const sorted=ks.slice().sort((a,b)=>qOrder[snap[a].q]-qOrder[snap[b].q]||snap[b].score-snap[a].score);
  $("rows").innerHTML=sorted.map(k=>{const v=snap[k];return `<div class="row${k===st.focus?" focus":""}" data-k="${k}" tabindex="0" role="button" aria-label="${nm(k)}">
    <input type="checkbox" ${st.selected.has(k)?"checked":""} aria-label="Select ${k}" data-sel="${k}">
    <span class="sw" style="background:${colorOf[k]}"></span>
    <span class="nm"><b>${k}</b><small>${NAMES[k]||""}</small></span>
    <span><span class="pill" style="--c:${Q[v.q].c}">${Q[v.q].label}</span></span>
    <span class="arrow" title="${describeHeading(v.hd.deg)}" style="color:${Q[v.q].c}">${v.hd.glyph}</span>
    <span class="num ret ${v.ret>=0?"pos":"neg"}">${pct(v.ret)}</span>
    <span class="num ${v.rel>=0?"pos":"neg"}">${pct(v.rel)}</span></div>`}).join("");
}
function setFocus(k){st.focus=k;persist();render()}

/* ---------- tooltip ---------- */
function showTip(k,ev){
  const p=params(),{snap}=snapshot(p),s=snap[k],tip=$("tip"),card=$("chartCard").getBoundingClientRect(),r=ev.target.getBoundingClientRect();
  tip.innerHTML=`<b>${nm(k)}</b> <span class="mono" style="color:var(--muted)">${k}</span><br><span class="pill" style="--c:${Q[s.q].c}">${Q[s.q].label}</span> <span class="mono">${s.hd.glyph}</span><br><span class="mono">Ratio ${s.x.toFixed(2)} · Mom ${s.y.toFixed(2)}</span><br><span class="mono">${st.period} ${pct(s.ret)} · vs ${st.raw.bench} ${pct(s.rel)}</span>`;
  tip.hidden=false;
  let L=r.left-card.left+16,T=r.top-card.top-10;if(L+190>card.width)L=r.left-card.left-200;
  tip.style.left=L+"px";tip.style.top=T+"px";
}
function hideTip(){$("tip").hidden=true}

/* ---------- controls ---------- */
function seg(id,key,cast,after){const s=$(id);s.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b||b.disabled)return;st[key]=cast(b.dataset.v);syncSeg();persist();after()})}
function syncSeg(){
  [["tfSeg","tf"],["smSeg","smooth"],["perSeg","period"]].forEach(([id,k])=>$(id).querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v)===String(st[k]))));
  $("tfD").disabled=st.raw&&st.raw.freq==="W";
  $("labels").checked=st.labels;$("onlySel").checked=st.onlySel;$("tail").value=st.tail;
}
seg("tfSeg","tf",v=>v,()=>{st.zoom=1;rebuild(false)});
seg("smSeg","smooth",v=>+v,()=>rebuild(true));
seg("perSeg","period",v=>v,()=>render());
$("tail").addEventListener("input",e=>{st.tail=+e.target.value;persist();render()});
$("labels").addEventListener("change",e=>{st.labels=e.target.checked;persist();render()});
$("onlySel").addEventListener("change",e=>{st.onlySel=e.target.checked;persist();render()});
const zoomBy=f=>{st.zoom=Math.min(5,Math.max(0.4,st.zoom*f));render()};
$("zIn").onclick=()=>zoomBy(1.25);$("zOut").onclick=()=>zoomBy(0.8);$("zReset").onclick=()=>{st.zoom=1;render()};
svg.addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();zoomBy(e.deltaY<0?1.1:0.91)},{passive:false});
$("endIdx").addEventListener("input",e=>{stopPlay();st.end=+e.target.value;render()});
$("latest").onclick=()=>{stopPlay();st.end=st.active.dates.length-1;$("endIdx").value=st.end;render()};
function stopPlay(){if(st.playing){clearInterval(st.playing);st.playing=null;$("play").textContent="▶ Replay"}}
$("play").onclick=()=>{
  if(st.playing)return stopPlay();
  const n=st.active.dates.length,step=st.tf==="W"?1:2;
  if(st.end>=n-1)st.end=Math.max(st.first+1,n-1-(st.tf==="W"?52:250));
  $("play").textContent="❚❚ Pause";
  st.playing=setInterval(()=>{st.end=Math.min(n-1,st.end+step);$("endIdx").value=st.end;render();if(st.end>=n-1)stopPlay()},st.tf==="W"?700:250);
};
$("rows").addEventListener("click",e=>{
  const sel=e.target.closest("[data-sel]");
  if(sel){const k=sel.dataset.sel;sel.checked?st.selected.add(k):st.selected.delete(k);persist();render();return}
  const r=e.target.closest(".row");if(r)setFocus(r.dataset.k);
});
$("rows").addEventListener("keydown",e=>{const r=e.target.closest(".row");if(r&&(e.key==="Enter"||e.key===" ")&&e.target===r){e.preventDefault();setFocus(r.dataset.k)}});
$("selAll").onclick=()=>{st.selected=new Set(Object.keys(st.res));persist();render()};
$("selNone").onclick=()=>{st.selected=new Set();persist();render()};

/* ---------- data source ---------- */
function useData(ds,msg){
  st.raw=ds;assignColors();
  if(ds.freq==="W")st.tf="W";
  if(!st.raw.series[st.focus]||st.focus===ds.bench)st.focus=Object.keys(ds.series).find(k=>k!==ds.bench);
  const valid=new Set([...st.selected].filter(k=>ds.series[k]&&k!==ds.bench));
  st.selected=valid.size?valid:new Set(Object.keys(ds.series).filter(k=>k!==ds.bench));
  const b=$("srcBadge");b.classList.toggle("live",ds.source!=="sample");
  const last=new Date(ds.dates[ds.dates.length-1]).toISOString().slice(0,10);
  $("srcText").textContent=ds.source==="snapshot"?`Nasdaq · close ${last}`:ds.source==="live"?`Live · last close ${last}`:ds.source==="import"?`Your CSV · to ${last}`:"Sample data · not real prices";
  syncSeg();st.zoom=1;
  const p=params();
  if(st.tf==="D"&&ds.dates.length<p.N+p.M+p.S+20){st.tf="W";syncSeg()}
  rebuild(false);
  if(msg)msg();
}
/* ---------- live prices via the viewer's Composio connector ---------- */
const LIVE={server:"Composio",tool:"COMPOSIO_MULTI_EXECUTE_TOOL",tickers:["SPY",...Object.keys(NAMES)]};
const MONTHS={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
let mcp=null,liveTimer=null,liveBusy=false;
const liveMsg=(t,cls)=>{const e=$("liveMsg");e.textContent=t||"";e.style.color=cls==="err"?"var(--q-lag)":""};
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}}
function findGraph(o,d){if(!o||typeof o!=="object"||(d||0)>10)return null;if(Array.isArray(o.graph))return o;for(const k in o){const r=findGraph(o[k],(d||0)+1);if(r)return r}return null}
function findMessage(o,d){if(!o||typeof o!=="object"||(d||0)>10)return null;if(typeof o.composio_execution_message==="string")return o.composio_execution_message;for(const k in o){const r=findMessage(o[k],(d||0)+1);if(r)return r}return null}
function parseDay(s){const m=/^([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/.exec(s||"");return m&&MONTHS[m[1]]!=null?Date.UTC(+m[3],MONTHS[m[1]],+m[2]):null}
async function fetchTicker(tk,fresh){
  const input={tools:[{tool_slug:"COMPOSIO_SEARCH_FINANCE",arguments:{query:tk+":NYSEARCA",window:"1Y"}}],sync_response_to_workbench:false,thought:"Daily closes for a sector rotation chart"};
  const res=await mcp.callTool(LIVE.server,LIVE.tool,input,{cache:{staleTime:300000,gcTime:3600000,refresh:!!fresh}});
  let p=res.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
  const g=findGraph(p);
  if(!g||!g.graph.length)throw{code:"no_data",message:findMessage(p)||"No prices came back."};
  const map=new Map();g.graph.forEach(pt=>{const d=parseDay(pt.date);if(d!=null&&isFinite(pt.price)&&pt.price>0)map.set(d,pt.price)});
  return {map,storedAt:res.cache&&res.cache.storedAt};
}
async function fetchWithRetry(tk,fresh){
  try{return await fetchTicker(tk,fresh)}
  catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||1500)+Math.random()*800));return fetchTicker(tk,fresh)}throw e}
}
function explain(e){
  switch(e&&e.code){
    case "server_not_connected":case "selection_required":return"Add or choose the Composio connector in claude.ai Settings → Connectors to load live prices.";
    case "needs_reauth":return"Reconnect Composio in claude.ai Settings → Connectors to load live prices.";
    case "not_in_manifest":case "consent_required":return"Live prices are turned off for this page. Allow Composio in the page's permissions, then press Refresh prices.";
    case "approval_required":return"Live prices need your approval. Press Refresh prices and allow the Composio request.";
    case "blocked_by_policy":return"Your organization blocks this Composio tool, so live prices are unavailable.";
    case "server_unavailable":return"Composio didn't answer in time. Try Refresh prices in a minute.";
    case "no_data":return"Google Finance returned no prices: "+e.message;
    case "tool_error":return"Composio reported an error: "+(e.message||"unknown");
    default:return"Live prices failed to load"+(e&&e.message?": "+e.message:".");
  }
}
const explainCode=e=>explain(e)+(e&&e.code?` [${e.code}]`:"");
async function loadLive(fresh){
  if(!mcp||liveBusy)return;liveBusy=true;
  $("refresh").disabled=true;liveMsg("Fetching prices for "+LIVE.tickers.length+" ETFs…");
  const maps={},failed={};let stamp=null;
  const groups=[["SPY"]];const rest=LIVE.tickers.filter(t=>t!=="SPY");for(let i=0;i<rest.length;i+=3)groups.push(rest.slice(i,i+3));
  for(let gi=0;gi<groups.length;gi++){
    const chunk=groups[gi];
    if(gi>0)liveMsg(`Fetching prices… ${Object.keys(maps).length} of ${LIVE.tickers.length}`);
    const out=await Promise.allSettled(chunk.map(tk=>fetchWithRetry(tk,fresh)));
    out.forEach((r,j)=>{const tk=chunk[j];if(r.status==="fulfilled"){maps[tk]=r.value.map;if(r.value.storedAt)stamp=Math.min(stamp||Infinity,r.value.storedAt)}else failed[tk]=r.reason});
    if(failed.SPY)break;
  }
  liveBusy=false;$("refresh").disabled=false;
  const ok=Object.keys(maps).filter(k=>k!=="SPY");
  if(!maps.SPY||ok.length<2){
    const err=failed.SPY||Object.values(failed)[0];
    liveMsg(explainCode(err)+(st.raw?" Showing "+(st.raw.source==="sample"?"sample data":"the last data loaded")+" for now.":""),"err");
    $("refresh").hidden=false;return;
  }
  const dates=[...maps.SPY.keys()].sort((a,b)=>a-b),series={};
  ["SPY",...ok].forEach(tk=>{let last=null;series[tk]=dates.map(d=>{const v=maps[tk].get(d);if(v!=null)last=v;return last})});
  let start=0;while(start<dates.length&&Object.keys(series).some(k=>series[k][start]==null))start++;
  Object.keys(series).forEach(k=>series[k]=series[k].slice(start));
  const ds={source:"live",name:"Live",freq:"D",bench:"SPY",dates:dates.slice(start),series};
  const keepEnd=st.raw&&st.raw.source==="live";
  if(keepEnd){st.raw=ds;assignColors();rebuild(true)}else useData(ds);
  const missing=Object.keys(failed);
  const when=stamp?new Date(stamp):new Date();
  liveMsg(`Google Finance via Composio · fetched ${when.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`+(missing.length?` · not loaded: ${missing.join(", ")} (${explainCode(failed[missing[0]])})`:""),missing.length?"err":"");
  $("refresh").hidden=false;
  stopLive();liveTimer=setInterval(()=>{if(!document.hidden)loadLive(true)},15*60*1000);
}

function loadSnapshot(){const ds=parseCSV(SNAPSHOT.csv);ds.source="snapshot";useData(ds)}
loadSnapshot();
liveMsg(`Nasdaq daily closes · ${new Date(SNAPSHOT.asof+"T00:00:00Z").toLocaleDateString([], {month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})} close`);
})();
</script>
